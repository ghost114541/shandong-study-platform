name: macOS Preview arm64

on:
  workflow_dispatch:
  push:
    branches: [dev/dev-012-macos]
    paths:
      - '.github/workflows/macos-build-check.yml'
      - 'poc-001b/src/**'
      - 'poc-001b/src-tauri/**'
      - 'poc-001b/scripts/**'
      - 'poc-001b/package*.json'
      - 'poc-001b/tests/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    needs: windows-fixture
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: poc-001b
    env:
      CARGO_INCREMENTAL: '0'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      RUST_VERSION: '1.100.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: poc-001b/package-lock.json
      - name: Record the environment and select native Rust
        run: |
          mkdir -p preview-artifacts
          {
            git rev-parse HEAD
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
            echo "Runner label: macos-15. Runner architecture: $RUNNER_ARCH"
            uname -a
            test "$(uname -m)" = arm64
            sw_vers
            xcodebuild -version
            df -h .
            rustup toolchain install "$RUST_VERSION-aarch64-apple-darwin" --profile minimal
            rustup override set "$RUST_VERSION-aarch64-apple-darwin"
            rustc -vV
            cargo --version
            node --version
            npm --version
          } 2>&1 | tee preview-artifacts/environment.log
      - name: Install locked frontend dependencies
        run: |
          npm ci 2>&1 | tee preview-artifacts/npm-ci.log
          npm run tauri -- --version 2>&1 | tee -a preview-artifacts/environment.log
      - name: Check TypeScript and run frontend tests
        run: |
          npm run typecheck 2>&1 | tee preview-artifacts/typecheck.log
          npm test 2>&1 | tee preview-artifacts/typescript-tests.log
      - name: Run native Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml 2>&1 | tee preview-artifacts/rust-tests.log
      - uses: actions/download-artifact@v4
        with:
          name: knowpaper-dev012-windows-backup-${{ github.sha }}
          path: poc-001b/preview-artifacts/backup
      - name: Restore Windows fixture through the native data layer
        run: |
          evidence=preview-artifacts/backup
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example dev012_migration -- \
            restore "$evidence/windows.knowbackup" "$evidence/macos.knowbackup" \
            > "$evidence/restore.json" 2> >(tee "$evidence/restore.log" >&2)
          python3 tests/dev012-backup-fingerprint.py "$evidence/windows.knowbackup" \
            "$evidence/macos.knowbackup" > "$evidence/cross-platform-fingerprints.json"
      - name: Build native app and DMG
        run: npm run tauri -- build --target aarch64-apple-darwin -- --locked 2>&1 | tee preview-artifacts/build.log
      - name: Inspect app and DMG
        run: bash scripts/macos-package-check.sh 2>&1 | tee preview-artifacts/package-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowpaper-preview-macos-arm64-${{ github.sha }}
          path: poc-001b/preview-artifacts/
          if-no-files-found: error
          retention-days: 14

  windows-fixture:
    runs-on: windows-2025
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
        working-directory: poc-001b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create a new Windows backup from original synthetic data
        run: |
          New-Item -ItemType Directory -Path preview-artifacts -Force | Out-Null
          cargo run --locked --manifest-path src-tauri/Cargo.toml --example dev012_migration -- `
            seed output/dev010/original-fixture.knowbackup preview-artifacts/windows.knowbackup `
            > preview-artifacts/windows-manifest.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python tests/dev012-backup-fingerprint.py preview-artifacts/windows.knowbackup `
            > preview-artifacts/windows-fingerprints.json
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: knowpaper-dev012-windows-backup-${{ github.sha }}
          path: poc-001b/preview-artifacts/
          if-no-files-found: error
          retention-days: 14

  pdf-probe:
    runs-on: macos-15
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
        working-directory: poc-001b
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: poc-001b/package-lock.json
      - run: npm ci
      - run: command -v pdfinfo || brew install poppler
      - run: |
          mkdir -p preview-artifacts
          bash tests/macos-pdf-check.sh 2>&1 | tee preview-artifacts/pdf-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowpaper-macos-pdf-probe-${{ github.sha }}
          path: poc-001b/preview-artifacts/
          retention-days: 14
